[package]
name = "cleanse"
version = "0.1.0"
edition = "2024"
description = "Cleanse — Fast, zero-risk storage intelligence & reclamation for macOS and Windows built with Rune"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "1505f9210322e9bc75bf0f67c4134dde950fa9d2" }

# Keep builds fast and target/ lean (Rune workspace recommendation)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
